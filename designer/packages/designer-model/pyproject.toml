[project]
name = "designer-model"
version = "0.1.0"
description = "The Designer data model: items, derivation, persistence, model check."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designer_model"]

[tool.ruff]
line-length = 120
indent-width = 4
# No target-version here: ruff infers it from requires-python, and the two
# agreeing is the point. When they disagreed — requires-python at 3.14 while
# development ran on 3.12 — ruff correctly applied PEP 758 and rewrote
# `except (A, B):` to `except A, B:`, which 3.14 accepts and 3.12 rejects.
# Raise requires-python only when the interpreter in use has moved too.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"src/designer_model/data" = "designer_model/data"
