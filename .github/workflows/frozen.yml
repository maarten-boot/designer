# The frozen application: one download per platform, Python and tkinter inside.
#
# Builds on Linux, Windows and macOS with designer/tools/freeze.py, which also
# runs each build's self-test (open a window, start the test bench's worker)
# before packaging it. A tag `vX.Y.Z` also attaches the three files to the
# GitHub release for that tag: to it if it exists, else to a new *draft* that
# you publish yourself, with RELEASE-NOTES.md's section as its text.
#
# Run by hand from the Actions tab (workflow_dispatch) to build without a
# release; the files are then kept as workflow artifacts for a week.

name: frozen build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest supported Ubuntu: the binary needs a glibc at least as
          # new as the one it was built against
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: designer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.10"

      - name: Check the tag matches the packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('packages/designer-model/pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} but the packages say $version" >&2
            exit 1
          fi

      - name: Build and self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          xvfb-run -a python tools/freeze.py

      - name: Build and self-test
        if: runner.os != 'Linux'
        run: python tools/freeze.py

      - uses: actions/upload-artifact@v4
        with:
          name: frozen-${{ matrix.os }}
          path: designer/dist-frozen/*
          retention-days: 7
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: frozen
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l frozen
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" frozen/* --clobber
          else
            version="${TAG#v}"
            # the release notes' section for this version, up to the next heading
            awk -v v="## $version" '$0 == v {on=1; next} /^## / {on=0} on' \
              designer/RELEASE-NOTES.md > notes.md
            gh release create "$TAG" frozen/* --draft --title "Designer $version" --notes-file notes.md
          fi
