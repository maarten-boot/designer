[project]
name = "designer-ddl"
version = "0.6.0"
description = "SQL table definitions (PostgreSQL, MariaDB, SQLite) from a Designer schema export."
requires-python = ">=3.12"
# reads the export file only, never the model: no dependency on designer-model
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maarten Boot" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/maarten-boot/designer"
Source = "https://github.com/maarten-boot/designer"

[project.scripts]
designer-ddl = "designer_ddl.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designer_ddl"]

[tool.ruff]
line-length = 120
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
