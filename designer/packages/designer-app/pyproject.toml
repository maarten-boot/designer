[project]
name = "designer-app"
version = "0.1.0"
description = "The Designer desktop application."
requires-python = ">=3.12"
dependencies = ["designer-model"]

[project.scripts]
designer = "designer_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designer_app"]

[tool.ruff]
line-length = 120
indent-width = 4
# No target-version here: ruff infers it from requires-python, and the two
# agreeing is the point. See the note in designer-model's pyproject.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
