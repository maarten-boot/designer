[project]
name = "designer-model"
version = "0.1.0"
description = "The Designer data model: items, derivation, persistence, model check."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designer_model"]

[tool.ruff]
line-length = 120
indent-width = 4
# The package requires 3.14, but the formatter is pinned lower on purpose.
# Left to infer from requires-python, ruff targets 3.14 and applies PEP 758,
# rewriting `except (A, B):` to `except A, B:` — valid on 3.14 and a syntax
# error on anything older, which silently ends development on 3.12/3.13.
# requires-python is the floor for users; this is the floor for source syntax.
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"src/designer_model/data" = "designer_model/data"
