# A narrow net, not a typing campaign.
#
# Four bugs reached the user because an edit silently changed nothing and the
# stale reference survived: `Focus.members`, `_editor_note`, `_header`'s
# signature, an import ruff had already rewritten. Every one is an attribute or
# a call that does not exist, and every one is invisible to a test suite whose
# widget half skips without a display.
#
# So the rules enabled here are the ones that catch exactly that, and the noisy
# ones — Optional narrowing, invariance, third-party stubs — stay off. Turning
# them on later is a separate piece of work; leaving the net down is not.

[mypy]
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
disable_error_code = arg-type, assignment, return-value, call-overload, operator, index, union-attr, var-annotated, misc
files = packages/designer-model/src, packages/designer-app/src
mypy_path = packages/designer-model/src:packages/designer-app/src

[mypy-designer_app.*]
# tkinter's stubs disagree with plenty of legitimate widget use
disable_error_code = arg-type, assignment, return-value, call-overload, operator, index, union-attr, var-annotated, misc
