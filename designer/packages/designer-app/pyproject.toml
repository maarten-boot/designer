[project]
name = "designer-app"
version = "0.6.0"
description = "The Designer desktop application."
requires-python = ">=3.12"
# released together: an app is only promised to work with its own model version
dependencies = ["designer-model==0.6.0"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maarten Boot" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/maarten-boot/designer"
Source = "https://github.com/maarten-boot/designer"

[project.scripts]
designer = "designer_app.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designer_app"]

[tool.ruff]
line-length = 120
indent-width = 4
# No target-version here: ruff infers it from requires-python, and the two
# agreeing is the point. See the note in designer-model's pyproject.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
