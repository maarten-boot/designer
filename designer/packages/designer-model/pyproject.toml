[project]
name = "designer-model"
version = "0.6.0"
description = "The Designer data model: items, derivation, persistence, model check."
requires-python = ">=3.12"
dependencies = []
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maarten Boot" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/maarten-boot/designer"
Source = "https://github.com/maarten-boot/designer"

[project.scripts]
designer-check = "designer_model.cli:check_main"
designer-export = "designer_model.cli:export_main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/designer_model"]

[tool.ruff]
line-length = 120
indent-width = 4
# No target-version here: ruff infers it from requires-python, and the two
# agreeing is the point. When they disagreed — requires-python at 3.14 while
# development ran on 3.12 — ruff correctly applied PEP 758 and rewrote
# `except (A, B):` to `except A, B:`, which 3.14 accepts and 3.12 rejects.
# Raise requires-python only when the interpreter in use has moved too.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
